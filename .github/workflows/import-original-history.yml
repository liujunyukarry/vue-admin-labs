name: Verify preserved files and histories
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete target history and source refs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified official v6 commit
        with:
          fetch-depth: 0
      - name: Verify original trees, commits, branches and documentation links
        run: python3 scripts/verify_migration.py
      - name: Verify Git object integrity
        run: git fsck --full
