name: Import and verify original histories
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-original-history.yml
permissions:
  contents: write
concurrency:
  group: repository-history-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'liujunyukarry/vue-admin-labs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete target history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, SHA verified from official Git ref
        with:
          fetch-depth: 0
          ref: main
      - name: Import without rewriting original commits and verify before atomic push
        run: python3 scripts/bootstrap_import.py
